version: "0.1"
global_rules:
  - "Always distinguish facts, inferences, and assumptions."
  - "Prefer recent and relevant information."
  - "Do not present assumptions as facts."
  - "When evidence is weak, say so explicitly."
  - "Keep outputs structured and decision-oriented."
  - "Focus on actionable business and product insight."
output_conventions:
  markdown_sections: true
  json_summary_required: true
  citation_required_for_facts: true
decision_labels:
  - PASS
  - REVISE
  - PIVOT
  - REJECT
scoring_scale:
  min: 1
  max: 10